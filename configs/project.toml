# MMM 학습·검증용 실행 설정. CLI와 모델이 함께 읽는 값을 둡니다.
[data]
date_column = "wk_strt_dt"
target = "sales"
# 5채널 코어. 10채널 확장은 민감도 분석에서만.
channels = ["dm", "so", "vidtr", "viddig", "sem"]
spend_prefix = "mdsp_"
currency = "USD"
scope = "retrospective-simulation"
source_note = "data_GIT.csv lineage (US retail, 2014-08-03 to 2018-07-29). License/source to be confirmed before release."

[project]
frequency = "weekly"
target = "sales"
channels = ["dm", "so", "vidtr", "viddig", "sem"]
currency = "USD"

[simulation]
weekly_allocation = "uniform"
interval_probability = 0.8
# scenario.md section 5: total fixed, offsetting moves, non-negative.
extrapolation_guard = "flag-outside-historical-range"

[controls]
# Standardized linear controls. Forecast holds them at recent-13w mean (assumption, documented in outputs).
columns = ["me_gas_dpg", "me_ics_all", "st_ct"]
forecast_rule = "recent-13w-mean"

[holidays]
# Sparse hldy_* dummies are bundled, not estimated individually.
year_end = ["hldy_Christmas Eve", "hldy_Christmas Day", "hldy_Day after Christmas", "hldy_NYE", "hldy_New Year's Day"]
other = "any-other-hldy"

[seasonality]
# seas_prd_* period dummies only. seas_week_* deferred.
columns = "seas_prd_*"

[priors]
# Numeric table: docs/priors.md v1.0. ec50 fixed at train median for run 1.
spec = "docs/priors.md"
