[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-aware-mmm"
version = "0.2.0"
description = "Marketing budget simulator project scaffold"
requires-python = ">=3.12"
dependencies = ["pymc>=6.3", "arviz>=1.3", "numpy>=1.25", "pandas>=0.24", "netCDF4>=1.7", "streamlit>=1.65", "pytrends>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]

